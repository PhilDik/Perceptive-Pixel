<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">A multi-region pixel | geometry and channel identity</title><desc id="desc">The plan and oblique views use the same 3D vertices and channel numbering.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#24749a"/></marker></defs><rect x="0" y="0" width="1200" height="815" rx="0" fill="#f5f8fa" stroke="#f5f8fa"/><text x="44" y="52" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#172b3b">A multi-region pixel | geometry and channel identity</text><text x="44" y="84" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">The plan and oblique views use the same 3D vertices and channel numbering.</text><rect x="40" y="110" width="530" height="625" rx="14" fill="white" stroke="#cddbe2"/><rect x="595" y="110" width="565" height="625" rx="14" fill="white" stroke="#cddbe2"/><text x="66" y="153" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#172b3b">One conceptual display cell</text><text x="68" y="186" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Plan view: apex above the base centroid</text><polygon points="403.5,365.7557528611263 300.0,186.48849427774746 300.0,306.0" fill="#24749a" stroke="white" stroke-width="1.4"/><text x="334.5" y="292.08141571295795" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="white">R0</text><polygon points="300.0,186.48849427774746 196.5,365.75575286112627 300.0,306.0" fill="#44a6b2" stroke="white" stroke-width="1.4"/><text x="265.5" y="292.08141571295795" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#172b3b">R1</text><polygon points="196.5,365.75575286112627 403.5,365.7557528611263 300.0,306.0" fill="#9eced2" stroke="white" stroke-width="1.4"/><text x="300.0" y="351.8371685740842" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#172b3b">R2</text><path d="M353.6935750346352,275.0 L414.3153532995459,240.0" stroke="#24749a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M246.30642496536478,275.0 L185.6846467004541,240.0" stroke="#24749a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M300.0,368.0 L300.0,438.0" stroke="#24749a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="68" y="473" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Oblique view of the same physical pyramid</text><polygon points="408.0,618.6476803507358 300.0,487.7046392985286 300.0,549.2908576572457" fill="#24749a" stroke="white" stroke-width="1.4"/><text x="336.0" y="557.8810591021701" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="white">R0</text><polygon points="300.0,487.7046392985286 192.0,618.6476803507358 300.0,549.2908576572457" fill="#44a6b2" stroke="white" stroke-width="1.4"/><text x="264.0" y="557.8810591021701" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#172b3b">R1</text><polygon points="192.0,618.6476803507358 408.0,618.6476803507358 300.0,549.2908576572457" fill="#9eced2" stroke="white" stroke-width="1.4"/><text x="300.0" y="601.5287394529058" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#172b3b">R2</text><text x="69" y="655" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Equilateral base: 9 mm; centered height: 1.5 mm.</text><text x="69" y="681" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Each side face: 5.408 / 5.408 / 9 mm.</text><text x="69" y="707" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Congruent isosceles faces; area 13.5 mm² each.</text><text x="620" y="153" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#172b3b">Receive state: all three regions are read</text><rect x="620" y="200" width="91" height="60" rx="14" fill="#e7f1f5" stroke="#cddbe2"/><text x="665" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3b">R0</text><path d="M712,230 L767,230" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="771" y="200" width="188" height="60" rx="14" fill="white" stroke="#cddbe2"/><text x="865" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3b">Mode switch</text><text x="865" y="248" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5a6c79">drive / integrate</text><path d="M960,230 L1024,230" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="237" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#24749a">Q0</text><rect x="620" y="315" width="91" height="60" rx="14" fill="#e7f1f5" stroke="#cddbe2"/><text x="665" y="353" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3b">R1</text><path d="M712,345 L767,345" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="771" y="315" width="188" height="60" rx="14" fill="white" stroke="#cddbe2"/><text x="865" y="340" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3b">Mode switch</text><text x="865" y="363" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5a6c79">drive / integrate</text><path d="M960,345 L1024,345" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="352" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#24749a">Q1</text><rect x="620" y="430" width="91" height="60" rx="14" fill="#e7f1f5" stroke="#cddbe2"/><text x="665" y="468" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#172b3b">R2</text><path d="M712,460 L767,460" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="771" y="430" width="188" height="60" rx="14" fill="white" stroke="#cddbe2"/><text x="865" y="455" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#172b3b">Mode switch</text><text x="865" y="478" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5a6c79">drive / integrate</text><path d="M960,460 L1024,460" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1040" y="467" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#24749a">Q2</text><text x="620" y="561" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Display state: regions contribute to one visible pixel.</text><text x="620" y="589" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Receive state: Q0, Q1, Q2 remain separate.</text><text x="620" y="617" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Contacts, material and fabrication remain open.</text><text x="620" y="662" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">Arrows in plan view: horizontal projections</text><text x="620" y="690" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">of the three outward normals (tilt: 30° from +z).</text><text x="44" y="790" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6c79">Conceptual illustration • not a fabricated device • not to scale</text></svg>