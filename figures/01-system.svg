<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>FacetCensus | geometry and surface appearance</title><desc>The whole sensing matrix, optical encoding, illumination and motion form one acquisition system.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#2d82a6"/></marker><pattern id="unknown" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#9eacb6" stroke-width="2"/></pattern></defs><rect width="1200" height="760" fill="#f3f7fa"/><text x="38" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#18354b">FacetCensus | geometry and surface appearance</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">The whole sensing matrix, optical encoding, illumination and motion form one acquisition system.</text><rect x="35" y="116" width="330" height="246" rx="12" fill="white" stroke="#c8d8e1"/><rect x="435" y="116" width="330" height="246" rx="12" fill="white" stroke="#c8d8e1"/><rect x="835" y="116" width="330" height="246" rx="12" fill="white" stroke="#c8d8e1"/><text x="55" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18354b">Observed scene</text><g transform="translate(0,50) scale(1,0.82)"><polygon points="75,279 191,320 319,265 208,232" fill="#dbeaf1" stroke="#c8d8e1" stroke-width="2"/><polygon points="75,279 75,185 208,144 208,232" fill="#e7edf0" stroke="#c8d8e1" stroke-width="2"/><polygon points="208,144 319,184 319,265 208,232" fill="#c4dbe6" stroke="#c8d8e1" stroke-width="2"/><polygon points="225,174 256,185 256,216 225,205" fill="#e0a44f" stroke="#c8d8e1" stroke-width="2"/><polygon points="259,186 294,199 294,229 259,217" fill="#5e9fa2" stroke="#c8d8e1" stroke-width="2"/></g><text x="55" y="342" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5b7080">Visible surfaces + illumination</text><text x="455" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18354b">Sensing display</text><rect x="475" y="174" width="27" height="23" rx="3" fill="#e09a48"/><rect x="509" y="174" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="543" y="174" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="577" y="174" width="27" height="23" rx="3" fill="#e09a48"/><rect x="611" y="174" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="645" y="174" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="679" y="174" width="27" height="23" rx="3" fill="#e09a48"/><rect x="475" y="204" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="509" y="204" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="543" y="204" width="27" height="23" rx="3" fill="#e09a48"/><rect x="577" y="204" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="611" y="204" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="645" y="204" width="27" height="23" rx="3" fill="#e09a48"/><rect x="679" y="204" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="475" y="234" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="509" y="234" width="27" height="23" rx="3" fill="#e09a48"/><rect x="543" y="234" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="577" y="234" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="611" y="234" width="27" height="23" rx="3" fill="#e09a48"/><rect x="645" y="234" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="679" y="234" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="475" y="264" width="27" height="23" rx="3" fill="#e09a48"/><rect x="509" y="264" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="543" y="264" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="577" y="264" width="27" height="23" rx="3" fill="#e09a48"/><rect x="611" y="264" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="645" y="264" width="27" height="23" rx="3" fill="#2d82a6"/><rect x="679" y="264" width="27" height="23" rx="3" fill="#e09a48"/><text x="455" y="316" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5b7080">Planar or multi-region pixels</text><text x="455" y="340" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5b7080">Optical encoding is specified</text><text x="855" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18354b">Registered observations</text><text x="855" y="195" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Receiver location + channel</text><text x="855" y="229" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Spectrum / illumination state</text><text x="855" y="263" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Exposure + panel pose</text><text x="855" y="297" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Calibration + uncertainty</text><path d="M374,236 L424,236" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M774,236 L824,236" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="35" y="410" width="470" height="236" rx="12" fill="white" stroke="#c8d8e1"/><text x="57" y="449" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18354b">Joint scene estimation</text><text x="57" y="493" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Predict the full measurement set</text><text x="57" y="529" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Fit geometry and surface appearance</text><text x="57" y="565" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Account for mixing, motion and lighting</text><text x="57" y="601" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Check ambiguity and unsupported detail</text><rect x="660" y="410" width="505" height="236" rx="12" fill="white" stroke="#c8d8e1"/><text x="685" y="449" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18354b">Persistent environment state</text><text x="685" y="493" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Surfaces and object motion</text><text x="685" y="529" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Appearance under stated conditions</text><text x="685" y="565" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Visibility, support and uncertainty</text><text x="685" y="601" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#5b7080">Update only where new evidence helps</text><path d="M1000,371 V390 H270 V402" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M514,529 L645,529" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><text x="46" y="693" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#18354b">Known illumination and registered motion provide additional constraints; a pyramid is optional.</text><text x="38" y="734" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5b7080">Conceptual architecture: optical acquisition, reconstruction and persistent scene state.</text></svg>
