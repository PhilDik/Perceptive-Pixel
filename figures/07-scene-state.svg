<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Scene reconstruction | appearance with observation support</title><desc>Texture is attached through the optical model and estimated surfaces, not by copying detector addresses.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#2d82a6"/></marker><pattern id="unknown" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10 L10,0" stroke="#9eacb6" stroke-width="2"/></pattern></defs><rect width="1200" height="760" fill="#f3f7fa"/><text x="38" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#18354b">Scene reconstruction | appearance with observation support</text><text x="38" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Texture is attached through the optical model and estimated surfaces, not by copying detector addresses.</text><rect x="35" y="115" width="350" height="260" rx="12" fill="white" stroke="#c8d8e1"/><rect x="425" y="115" width="350" height="260" rx="12" fill="white" stroke="#c8d8e1"/><rect x="815" y="115" width="350" height="260" rx="12" fill="white" stroke="#c8d8e1"/><text x="55" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18354b">1  Preserve measurements</text><text x="55" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Separate receiver channels</text><text x="55" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Time and spectral metadata</text><text x="55" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Calibrated optical mixing</text><text x="55" y="290" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Registered panel trajectory</text><text x="55" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Noise and invalid samples</text><text x="445" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18354b">2  Estimate and associate</text><text x="445" y="194" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Geometry + visibility</text><text x="445" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Appearance from encoded data</text><text x="445" y="258" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Lighting / material assumptions</text><text x="445" y="290" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Dynamic-object separation</text><text x="445" y="322" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Held-out observation checks</text><text x="835" y="151" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18354b">3  Update scene state</text><text x="835" y="194" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Fuse compatible evidence</text><text x="835" y="226" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Retain confidence and support</text><text x="835" y="258" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Resolve conflicting observations</text><text x="835" y="290" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Keep hidden regions unknown</text><text x="835" y="322" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5b7080">Do not label prediction as sensing</text><path d="M390,246 L415,246" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M780,246 L805,246" stroke="#2d82a6" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="35" y="411" width="550" height="260" rx="12" fill="white" stroke="#c8d8e1"/><text x="58" y="450" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18354b">A surface is more than a coloured mesh</text><g transform="translate(0,103) scale(1,0.82)"><polygon points="90,595 267,637 472,572 295,526" fill="#d8e7ed" stroke="#c8d8e1" stroke-width="2"/><polygon points="90,595 90,499 295,438 295,526" fill="#d9e7ee" stroke="#c8d8e1" stroke-width="2"/><polygon points="295,438 472,489 472,572 295,526" fill="#c6dce6" stroke="#c8d8e1" stroke-width="2"/><polygon points="315,467 366,482 366,516 315,501" fill="#dfae65" stroke="#c8d8e1" stroke-width="2"/><polygon points="371,484 432,502 432,537 371,518" fill="#719eb1" stroke="#c8d8e1" stroke-width="2"/><polygon points="315,507 366,523 366,551 315,536" fill="url(#unknown)" stroke="#c8d8e1" stroke-width="2"/></g><rect x="645" y="411" width="520" height="260" rx="12" fill="white" stroke="#c8d8e1"/><text x="670" y="450" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#18354b">Output labels</text><text x="670" y="494" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Geometry: estimated positions and normals</text><text x="670" y="528" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Appearance: lighting/view conditions retained</text><text x="670" y="562" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Reflectance: only within a justified model</text><text x="670" y="596" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">Unknown / inferred: explicit separate status</text><text x="670" y="630" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5b7080">No automatic RGB from three identical facets</text><text x="38" y="734" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5b7080">Conceptual architecture and target representation — no reconstructed scene is shown.</text></svg>
