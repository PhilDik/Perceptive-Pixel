<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Temporal scene model | retain, observe, update</title><desc id="desc">New optical measurements update the scene representation; predictions remain identifiable.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#24749a"/></marker></defs><rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f8fa" stroke="#f5f8fa"/><text x="44" y="52" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#172b3b">Temporal scene model | retain, observe, update</text><text x="44" y="84" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#5a6c79">New optical measurements update the scene representation; predictions remain identifiable.</text><rect x="40" y="120" width="345" height="480" rx="14" fill="white" stroke="#cddbe2"/><rect x="425" y="120" width="345" height="480" rx="14" fill="white" stroke="#cddbe2"/><rect x="810" y="120" width="350" height="480" rx="14" fill="white" stroke="#cddbe2"/><text x="60" y="167" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#172b3b">Previous state</text><polygon points="140,342 140,277 155,260 170,279 176,237 192,232 201,278 207,219 223,216 230,274 240,230 256,235 253,288 268,260 282,269 277,329 255,371 245,399 169,399 160,374" fill="#e7f1f5" stroke="#24749a" stroke-width="2"/><text x="67" y="514" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Retain relatively stable shape.</text><text x="67" y="542" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Predict pose and articulation.</text><text x="445" y="167" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#172b3b">New observations</text><polygon points="525,342 525,277 540,260 555,279 561,237 577,232 586,278 592,219 608,216 615,274 625,230 641,235 638,288 653,260 667,269 662,329 640,371 630,399 554,399 545,374" fill="#e7f1f5" stroke="#24749a" stroke-width="2"/><path d="M490,448 L575,308" stroke="#db8234" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M490,461 L597,323" stroke="#db8234" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M490,474 L619,338" stroke="#db8234" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="452" y="514" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Register the display pose.</text><text x="452" y="542" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Use all available facet readings.</text><text x="830" y="167" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#172b3b">Updated state</text><polygon points="910,342 910,277 925,260 940,279 946,237 962,232 971,278 977,219 993,216 1000,274 1010,230 1026,235 1023,288 1038,260 1052,269 1047,329 1025,371 1015,399 939,399 930,374" fill="#e7f1f5" stroke="#24749a" stroke-width="2"/><path d="M1025,283 L1050,326 L1047,372" fill="none" stroke="#8b9299" stroke-width="9" stroke-dasharray="5 6"/><text x="851" y="445" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6c79">Dashed: not currently observed</text><text x="837" y="514" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Correct supported geometry.</text><text x="837" y="542" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#5a6c79">Preserve uncertainty elsewhere.</text><path d="M385,361 L421,361" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M770,361 L806,361" stroke="#24749a" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="58" y="645" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5a6c79">A hand is only an application example. No hand reconstruction was computed in this revision.</text><text x="58" y="673" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#5a6c79">The numerical example below concerns one isolated diffuse patch.</text><text x="44" y="735" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5a6c79">Conceptual illustration • not a fabricated device • not to scale</text></svg>